[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calokey"
version = "0.1.0"
description = "Windows companion app for the Korg nanoKEY Studio"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.5",
    "mido>=1.3",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["state"]

[tool.setuptools.packages.find]
where = ["src"]
